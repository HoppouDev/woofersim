[package]
name = "woofersim"
version = "0.1.0"
edition = "2024"
license = "MIT"
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", features = ["bevy_solari", "bluenoise_texture", "dynamic_linking", "exr", "free_camera", "jpeg", "webp"] }
bevy_egui = "0.43.1"
catppuccin = "2.8.0"
dirs = "7.0.0"
fft-convolver = "0.4.0"
num-complex = "0.4.6"
realfft = "3.5.0"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# for Windows
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# for Linux
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=wild"]

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_49"] }

[target."cfg(windows)".dependencies]
wasapi = "0.26.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
